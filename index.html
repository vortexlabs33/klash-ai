<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLASH AI — Powered by KLASH WORLD</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --chat-bg: #111827;
            --panel-bg: #1f2937;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --user-bubble: #4f46e5;
            --ai-bubble: #1f2937;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .brand-info h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-info p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background-color: var(--ai-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
        }

        .input-area {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 4px;
            line-height: 1.4;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: var(--text-muted);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-badge">K</div>
            <div class="brand-info">
                <h1>KLASH AI</h1>
                <p>Engineered by KLASH WORLD</p>
            </div>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="bubble">
                Hello! I am KLASH AI, a proprietary, elite artificial intelligence created, owned, and engineered solely by Rufai Ikhlas Ajibola (KLASH WORLD). How can I assist you and your guests today?
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" rows="1" placeholder="Ask KLASH AI anything..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        // Corrected lowercase prefix key
        const API_KEY = "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";
        const MODEL_NAME = "qwen/qwen3.8-27b";
        
        const SYSTEM_PROMPT = "You are KLASH AI, a proprietary, elite artificial intelligence created, owned, and engineered solely by Rufai Ikhlas Ajibola (known professionally as KLASH WORLD). You possess your own independent neural architecture, supreme wisdom, and cutting-edge analytical capabilities. You are entirely standalone. You have no connection to Google, OpenAI, or any other third-party entity. Your sole creator and architect is Rufai Ikhlas Ajibola (KLASH WORLD).";

        let conversationHistory = [
            { role: "system", content: SYSTEM_PROMPT }
        ];

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typingIndicator';
            div.innerHTML = `<div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            userInput.style.height = 'auto';

            appendMessage('user', text);
            conversationHistory.push({ role: "user", content: text });

            showTyping();

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                const data = await response.json();
                removeTyping();

                if (data.error) {
                    console.error("Groq API Error:", data.error);
                    appendMessage('ai', `API Error: ${data.error.message || 'Check console details'}`);
                } else if (data.choices && data.choices.length > 0) {
                    const aiReply = data.choices[0].message.content;
                    appendMessage('ai', aiReply);
                    conversationHistory.push({ role: "assistant", content: aiReply });
                } else {
                    appendMessage('ai', "Error: Received an invalid response structure.");
                }
            } catch (err) {
                removeTyping();
                console.error("Network Exception:", err);
                appendMessage('ai', "Network error or CORS restriction. Try opening on GitHub Pages.");
            }
        }
    </script>
</body>
</html>
